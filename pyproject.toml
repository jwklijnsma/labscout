[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labscout"
dynamic = ["version"]
description = "Discover your homelab with a local Ollama model: scan the network and Proxmox, identify the software, plan monitoring, fill NetBox and your infra repo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Wiebe Klijnsma" }]
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
labscout = "labscout.cli:main"

[tool.setuptools.dynamic]
version = { attr = "labscout.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"labscout.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
